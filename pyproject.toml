[project]
name = "lancamento-cln"
version = "1.4.0"
description = "Motor ETL de lancamento de recebimentos CLN no Mega ERP (reescrita Python do fluxo Power Automate LancamentoCLN_GoLive)."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "requests>=2.31",
    "python-dateutil>=2.9",
    "python-dotenv>=1.0",
    # Pre-processamento de PDFs sem camada de texto (utils/pdf_preproc.py,
    # utils/pdf_preflight.py). Opcional em runtime: se ausente, o fluxo segue
    # enviando o PDF original.
    "pymupdf>=1.24",
    "pillow>=10.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
lancamento-cln = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
